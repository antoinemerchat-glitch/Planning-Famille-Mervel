<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Famille — Planning</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2F6F5E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF0E9;
    --surface: #FFFFFF;
    --border: #DBD9CC;
    --ink: #20261F;
    --muted: #6C7166;
    --accent: #2F6F5E;
    --accent-ink: #FFFFFF;
    --warn: #C1502E;
    --holiday-bg: #F5E9D2;
    --repos-bg: repeating-linear-gradient(45deg, #E4E2D8, #E4E2D8 4px, #D6D4C6 4px, #D6D4C6 8px);
    --radius: 10px;
    --shadow: 0 2px 10px rgba(32,38,31,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding-bottom:90px;
    -webkit-tap-highlight-color:transparent;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  header.top{
    padding:20px 16px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  header.top h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.02em;
  }
  header.top h1 span{color:var(--accent);}
  .today-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:99px;
    padding:5px 10px;
  }

  /* Today card */
  .today-card{
    margin:0 16px 16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .today-card h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    margin:0 0 10px;
  }
  .birthday-row{
    display:flex;align-items:center;gap:8px;
    background:#FBF0DD;
    border:1px solid #EAD9AE;
    border-radius:8px;
    padding:7px 10px;
    font-size:13.5px;
    font-weight:600;
    margin-bottom:8px;
  }
  .avail-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 0;
    border-top:1px solid var(--border);
  }
  .avail-row:first-of-type{border-top:none;}
  .avail-member{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;}
  .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .avail-status{font-size:13px;color:var(--muted);}
  .avail-status.busy{color:var(--ink);font-weight:500;}

  /* Members legend */
  .members-bar{
    margin:0 16px 10px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }
  .chip{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:99px;
    padding:5px 10px 5px 8px;
    font-size:13px;
    font-weight:500;
  }
  .chip button{
    border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 0 0 4px;
  }
  .add-member-btn, .birthdays-btn{
    border:1px dashed var(--border);
    background:none;
    border-radius:99px;
    padding:5px 12px;
    font-size:13px;
    color:var(--muted);
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .legend-note{
    margin:0 16px 16px;
    font-size:11.5px;
    color:var(--muted);
    display:flex;flex-wrap:wrap;gap:10px;
  }
  .legend-note span{display:inline-flex;align-items:center;gap:5px;}
  .legend-note i{width:9px;height:9px;border-radius:2px;display:inline-block;}

  /* Calendar */
  .cal-nav{
    margin:0 16px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .cal-nav .month-label{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:17px;
    text-transform:capitalize;
  }
  .cal-nav-btns{display:flex;gap:6px;}
  .navbtn{
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:8px;
    width:32px;height:32px;
    font-size:15px;
    cursor:pointer;
    color:var(--ink);
  }
  .navbtn.today{width:auto;padding:0 10px;font-size:12px;font-family:'IBM Plex Mono',monospace;}

  .month-table-wrap{
    margin:0 16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:auto;
    box-shadow:var(--shadow);
    max-height:72vh;
  }
  table.month-table{
    border-collapse:collapse;
    width:100%;
    table-layout:fixed;
  }
  table.month-table th, table.month-table td{
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
  }
  table.month-table th:last-child, table.month-table td:last-child{border-right:none;}

  th.col-day, td.col-day{
    position:sticky;
    left:0;
    background:var(--surface);
    z-index:2;
    width:58px;
    min-width:58px;
  }
  thead th{
    position:sticky;
    top:0;
    background:var(--surface);
    z-index:1;
    padding:8px 6px;
    font-size:12px;
    font-weight:600;
    text-align:left;
  }
  thead th.col-day{z-index:3;}
  th.member-th{white-space:nowrap;}
  th.member-th .th-inner{display:flex;align-items:center;gap:6px;}

  td.col-day{
    padding:6px 6px;
    font-family:'IBM Plex Mono',monospace;
    vertical-align:middle;
  }
  td.col-day .dnum{font-size:13px;font-weight:600;display:flex;align-items:center;gap:3px;}
  td.col-day .dwd{font-size:10px;color:var(--muted);text-transform:uppercase;}
  tr.weekend td.col-day{background:#F1EFE6;}
  tr.holiday td.col-day{background:var(--holiday-bg);}
  tr.is-today td.col-day{background:#E4EFE8;}
  tr.is-today td.col-day .dnum{color:var(--accent);}

  td.member-cell{
    padding:6px 5px;
    cursor:pointer;
    vertical-align:middle;
  }
  td.member-cell:hover{background:#F7F6F0;}
  .time-bar{
    position:relative;
    height:16px;
    border-radius:4px;
    background:#EEECE1;
    border:1px solid var(--border);
    overflow:hidden;
  }
  .time-bar .seg{
    position:absolute;
    top:0;bottom:0;
  }
  .time-bar .seg.repos{background-image:var(--repos-bg);}
  .chip-stack{display:flex;flex-direction:column;gap:2px;}
  .evt-chip{
    font-size:10px;
    line-height:1.35;
    padding:2px 5px;
    border-radius:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-weight:600;
  }
  .evt-chip.repos{background-image:var(--repos-bg);color:var(--ink);}
  .cell-empty{color:var(--border);font-size:11px;text-align:center;}

  /* FAB */
  .fab{
    position:fixed;
    bottom:22px;right:22px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    font-size:26px;
    box-shadow:0 4px 14px rgba(47,111,94,0.4);
    cursor:pointer;
    z-index:40;
  }

  /* Overlay / sheet */
  .overlay{
    position:fixed;inset:0;
    background:rgba(32,38,31,0.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.open{display:flex;}
  @media(min-width:640px){
    .overlay{align-items:center;}
  }
  .sheet{
    background:var(--surface);
    width:100%;
    max-width:480px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:18px 18px 22px;
  }
  @media(min-width:640px){
    .sheet{border-radius:16px;}
  }
  .sheet h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px;
    margin:0 0 4px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .sheet .closebtn{border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer;}
  .sheet .subdate{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:14px;}

  /* Day panel per-member chip summary */
  .day-summary{margin-bottom:14px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .day-summary-row{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-top:1px solid var(--border);}
  .day-summary-row:first-child{border-top:none;}
  .day-summary-name{width:76px;flex-shrink:0;font-size:12px;font-weight:600;padding-top:2px;}
  .day-summary-chips{flex:1;display:flex;flex-wrap:wrap;gap:4px;}
  .day-summary-chips .evt-chip{font-size:11px;padding:3px 7px;}
  .day-summary-empty{font-size:12px;color:var(--muted);padding-top:2px;}

  /* event list */
  .evt-item{
    display:flex;align-items:flex-start;gap:8px;
    padding:8px 0;
    border-top:1px solid var(--border);
  }
  .evt-item:first-of-type{border-top:none;}
  .evt-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .evt-body{flex:1;}
  .evt-title{font-size:14px;font-weight:600;}
  .evt-sub{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .evt-del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;}
  .empty-note{font-size:13px;color:var(--muted);padding:10px 0;}

  /* form */
  form.addform{margin-top:14px;border-top:1px solid var(--border);padding-top:14px;}
  form.addform label{
    display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);
    margin:10px 0 4px;font-weight:600;
  }
  form.addform label:first-child{margin-top:0;}
  .member-picker{display:flex;flex-wrap:wrap;gap:6px;}
  .member-opt{
    border:1.5px solid var(--border);
    border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;
    display:flex;align-items:center;gap:6px;font-weight:500;background:var(--surface);
  }
  .member-opt.selected{border-color:currentColor;background:color-mix(in srgb, currentColor 12%, white);}
  select, input[type=text], input[type=date], input[type=time]{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 10px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    background:var(--surface);
    color:var(--ink);
  }
  .type-picker{display:flex;flex-wrap:wrap;gap:6px;}
  .type-opt{
    border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;background:var(--surface);
  }
  .type-opt.selected{border-color:var(--accent);background:#EAF3EF;}
  .preset-picker{display:flex;flex-direction:column;gap:6px;}
  .preset-opt{
    border:2px solid transparent;border-radius:8px;padding:9px 11px;font-size:13px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;font-weight:600;
  }
  .preset-opt.selected{border-color:var(--ink);}
  .preset-opt .t{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12px;opacity:0.85;}
  .slot-picker{display:flex;flex-wrap:wrap;gap:6px;}
  .slot-opt{border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;background:var(--surface);}
  .slot-opt.selected{border-color:var(--accent);background:#EAF3EF;}
  .time-row{display:flex;gap:8px;}
  .time-row > div{flex:1;}
  .submitbtn{
    margin-top:16px;width:100%;
    background:var(--accent);color:var(--accent-ink);
    border:none;border-radius:8px;padding:12px;
    font-size:15px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4;}
  .color-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .color-row input[type=color]{width:44px;height:34px;border:1px solid var(--border);border-radius:6px;padding:2px;background:var(--surface);}

  .bday-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);}
  .bday-item:first-of-type{border-top:none;}
  .bday-name{flex:1;font-size:14px;font-weight:600;}
  .bday-date{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}

  .sync-note{
    margin:20px 16px 0;
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    line-height:1.5;
  }
</style>
</head>
<body>

<header class="top">
  <h1>Famille<span>.</span></h1>
  <div class="today-pill mono" id="todayPill"></div>
</header>

<section class="today-card">
  <h2>Aujourd'hui — qui est dispo</h2>
  <div id="todayBirthdays"></div>
  <div id="todayAvail"></div>
</section>

<div class="members-bar" id="membersBar"></div>
<div class="legend-note" id="legendNote"></div>

<div class="cal-nav">
  <div class="month-label" id="monthLabel"></div>
  <div class="cal-nav-btns">
    <button class="navbtn today" id="btnToday">Aujourd'hui</button>
    <button class="navbtn" id="btnPrev">‹</button>
    <button class="navbtn" id="btnNext">›</button>
  </div>
</div>

<div class="month-table-wrap">
  <table class="month-table">
    <thead><tr id="monthTableHead"></tr></thead>
    <tbody id="monthTableBody"></tbody>
  </table>
</div>

<p class="sync-note" id="syncNote">Chargement…</p>

<button class="fab" id="fabAdd">+</button>

<!-- Day panel -->
<div class="overlay" id="dayOverlay">
  <div class="sheet">
    <h3>Détail du jour <button class="closebtn" id="closeDayPanel">✕</button></h3>
    <div class="subdate mono" id="dayPanelDate"></div>
    <div id="daySummary"></div>
    <div id="dayEvtList"></div>
    <form class="addform" id="dayAddForm"></form>
  </div>
</div>

<!-- Quick add modal -->
<div class="overlay" id="addOverlay">
  <div class="sheet">
    <h3>Ajouter <button class="closebtn" id="closeAddPanel">✕</button></h3>
    <form class="addform" id="quickAddForm"></form>
  </div>
</div>

<!-- Add member modal -->
<div class="overlay" id="memberOverlay">
  <div class="sheet">
    <h3>Nouveau membre <button class="closebtn" id="closeMemberPanel">✕</button></h3>
    <label>Prénom</label>
    <input type="text" id="newMemberName" placeholder="Ex : Léa">
    <div class="color-row">
      <input type="color" id="newMemberColor" value="#3A5A8C">
      <span class="hint">Couleur utilisée pour ses RDV / gardes enfant / autres</span>
    </div>
    <button class="submitbtn" id="saveMemberBtn">Ajouter ce membre</button>
  </div>
</div>

<!-- Birthdays modal -->
<div class="overlay" id="birthdayOverlay">
  <div class="sheet">
    <h3>🎂 Anniversaires <button class="closebtn" id="closeBirthdayPanel">✕</button></h3>
    <div id="bdayList"></div>
    <form class="addform" id="bdayAddForm">
      <label>Prénom</label>
      <input type="text" id="bdayName" placeholder="Ex : Mamie Jeanne">
      <label>Date de naissance</label>
      <input type="date" id="bdayDate">
      <div class="hint">Seuls le jour et le mois comptent : ça revient chaque année automatiquement.</div>
      <button type="submit" class="submitbtn">Ajouter</button>
    </form>
  </div>
</div>

<script>
/* ---------- Config ---------- */
const TYPES = [
  {id:'rdv', label:'RDV', icon:'📅'},
  {id:'pompiers', label:'Pompiers', icon:'🚒'},
  {id:'edf', label:'EDF', icon:'⚡'},
];
// Types réservés à un événement personnel (un seul membre sélectionné)
const SOLO_ONLY_TYPES = ['pompiers','edf'];
// Seul ce membre (par prénom, insensible à la casse) voit apparaître Pompiers/EDF.
// Si tu renommes ce membre dans l'appli, mets à jour cette valeur.
const SOLO_ONLY_MEMBER_NAME = 'Antoine';

// Créneaux fixes EDF / Pompiers — couleur + horaires imposés
const SHIFT_PRESETS = [
  {id:'edf-matin',   typeId:'edf',      label:'EDF matin',       start:'05:45', end:'13:15', color:'#2E6FB0', textColor:'#fff'},
  {id:'edf-aprem',   typeId:'edf',      label:'EDF après-midi',  start:'13:15', end:'20:45', color:'#D9A824', textColor:'#2A2200'},
  {id:'edf-nuit',    typeId:'edf',      label:'EDF nuit',        start:'20:45', end:'05:45', color:'#C1372E', textColor:'#fff'},
  {id:'edf-journee', typeId:'edf',      label:'EDF journée',     start:'07:45', end:'16:45', color:'#2F6F5E', textColor:'#fff'},
  {id:'pomp-jour',   typeId:'pompiers', label:'Pompiers journée',start:'07:00', end:'19:00', color:'#7A4E9E', textColor:'#fff'},
  {id:'pomp-nuit',   typeId:'pompiers', label:'Pompiers nuit',   start:'19:00', end:'07:00', color:'#7A1F2B', textColor:'#fff'},
];
// Seule la nuit EDF déclenche le blocage indispo automatique le lendemain
const AUTO_UNAVAILABLE_PRESET_IDS = ['edf-nuit'];

const DEFAULT_COLORS = ['#3A5A8C','#B08900','#1E8FA6','#5B7F3A','#9C5B8C','#8C6239'];
const REPOS_END_DEFAULT = '13:00';



// Vacances scolaires — Zone A (académie de Grenoble, dont fait partie l'Ardèche)
// À compléter chaque année quand le calendrier suivant est publié.
const SCHOOL_HOLIDAYS = [
  {label:'Vacances de la Toussaint', start:'2025-10-18', end:'2025-11-03'},
  {label:'Vacances de Noël',         start:'2025-12-20', end:'2026-01-05'},
  {label:"Vacances d'hiver",         start:'2026-02-07', end:'2026-02-23'},
  {label:'Vacances de printemps',    start:'2026-04-04', end:'2026-04-20'},
  {label:"Pont de l'Ascension",      start:'2026-05-13', end:'2026-05-18'},
  {label:"Vacances d'été",           start:'2026-07-04', end:'2026-09-01'},
  {label:'Vacances de la Toussaint', start:'2026-10-17', end:'2026-11-02'},
  {label:'Vacances de Noël',         start:'2026-12-19', end:'2027-01-04'},
  {label:"Vacances d'hiver",         start:'2027-02-13', end:'2027-03-01'},
  {label:'Vacances de printemps',    start:'2027-04-10', end:'2027-04-26'},
];

const WEEKDAY_NAMES = ['lun','mar','mer','jeu','ven','sam','dim'];
const MONTH_NAMES = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* ---------- Config API ---------- */
// Colle ici l'URL de ton déploiement Apps Script (voir README.md)
const API_URL = 'https://script.google.com/macros/s/AKfycbwCLBmf3pggJY1_IMUzHAWwGN7f-zDQjB4ypyc2j8PRX8uxDRklFdUdKuGwF0e7fC2-gg/exec';

/* ---------- State ---------- */
let members = [];
let events = [];
let birthdays = [];
let currentMonth = new Date();
currentMonth.setDate(1);
let selectedDate = null;
let addFormSelectedMembers = [];
let addFormType = 'rdv';
let addFormPresetId = null;
let addFormCustomShift = false;

function todayStr(){ return fmt(new Date()); }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return fmt(d);
}
function toMinutes(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}

/* ---------- Event time/color helpers ---------- */
function eventRange(ev){
  if(ev.presetId){
    const p = SHIFT_PRESETS.find(x=>x.id===ev.presetId);
    if(p) return {start:p.start, end:p.end};
  }
  return {start: ev.start || '00:00', end: ev.end || '23:59'};
}
function eventIsOvernight(ev){
  const r = eventRange(ev);
  return toMinutes(r.end) <= toMinutes(r.start);
}
function eventColor(ev, member){
  if(ev.type==='repos') return null; // hachuré
  if(ev.presetId){
    const p = SHIFT_PRESETS.find(x=>x.id===ev.presetId);
    if(p) return {bg:p.color, fg:p.textColor};
  }
  return {bg: member ? member.color : '#999', fg:'#fff'};
}
function eventLabel(ev){
  if(ev.presetId){
    const p = SHIFT_PRESETS.find(x=>x.id===ev.presetId);
    if(p) return ev.label ? `${p.label} — ${ev.label}` : p.label;
  }
  const t = TYPES.find(x=>x.id===ev.type);
  const base = ev.label || (t? t.label : ev.type);
  if(!ev.presetId && (ev.type==='edf' || ev.type==='pompiers')){
    const r = eventRange(ev);
    return `${t.label} (${r.start}–${r.end})${ev.label ? ' — '+ev.label : ''}`;
  }
  return base;
}
function eventShortText(ev){
  const r = eventRange(ev);
  if(ev.type==='repos') return 'Indispo → '+r.end;
  if(ev.presetId){
    const p = SHIFT_PRESETS.find(x=>x.id===ev.presetId);
    return p ? p.label.replace(/^(EDF|Pompiers)\s*/,'') : r.start;
  }
  if(ev.type==='edf' || ev.type==='pompiers'){
    return ev.label ? ev.label : `${r.start}–${r.end}`;
  }
  return ev.label ? ev.label : (TYPES.find(x=>x.id===ev.type)?.label || ev.type);

}
function eventActiveAt(ev, dateStr, minutesOfDay){
  const r = eventRange(ev);
  const startMin = toMinutes(r.start), endMin = toMinutes(r.end);
  if(endMin > startMin){
    return dateStr===ev.date && minutesOfDay>=startMin && minutesOfDay<endMin;
  }
  if(dateStr===ev.date && minutesOfDay>=startMin) return true;
  if(dateStr===addDays(ev.date,1) && minutesOfDay<endMin) return true;
  return false;
}

/* ---------- Overlap detection ---------- */
function toDateTime(dateStr, hhmm){ return new Date(dateStr+'T'+hhmm+':00'); }
function eventIntervalDates(ev){
  const r = eventRange(ev);
  const start = toDateTime(ev.date, r.start);
  let end = toDateTime(ev.date, r.end);
  if(end.getTime()<=start.getTime()) end = new Date(end.getTime()+86400000);
  return {start, end};
}
function findOverlaps(candidate, memberId){
  const ci = eventIntervalDates(candidate);
  return events.filter(ev=>{
    if(ev.memberId!==memberId) return false;
    const ei = eventIntervalDates(ev);
    return ci.start < ei.end && ei.start < ci.end;
  });
}

/* ---------- Birthdays ---------- */
function birthdaysOn(dateStr){
  const md = dateStr.slice(5);
  return birthdays.filter(b=> b.date && b.date.slice(5)===md);
}

/* ---------- School holidays ---------- */
function holidayOn(dateStr){
  return SCHOOL_HOLIDAYS.find(h=> dateStr>=h.start && dateStr<h.end) || null;
}

/* ---------- Storage (Google Sheets via Apps Script) ---------- */
function setSyncNote(text, isError){
  const el = document.getElementById('syncNote');
  if(!el) return;
  el.textContent = text;
  el.style.color = isError ? 'var(--warn)' : 'var(--muted)';
}
function defaultMembers(){
  return [
    {id:uid(), name:'Toi', color: DEFAULT_COLORS[0]},
    {id:uid(), name:'Copine', color: DEFAULT_COLORS[1]},
  ];
}
async function loadData(){
  if(API_URL.includes('COLLE_ICI')){
    setSyncNote('⚠️ Aucune API configurée — voir README.md pour connecter le Google Sheet.', true);
    members = defaultMembers(); events = []; birthdays = [];
    return;
  }
  try{
    setSyncNote('Synchronisation…');
    const res = await fetch(API_URL + '?action=getData');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    members = (data.members && data.members.length) ? data.members : [];
    events = data.events || [];
    birthdays = data.birthdays || [];
    if(!members.length){ members = defaultMembers(); await saveMembers(); }
    setSyncNote('Synchronisé avec le Google Sheet familial.');
  }catch(err){
    console.error(err);
    setSyncNote('⚠️ Connexion au Sheet impossible — données non sauvegardées pour le moment.', true);
    if(!members.length) members = defaultMembers();
  }
}
async function postAction(action, payload){
  if(API_URL.includes('COLLE_ICI')) return;
  try{
    await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action, ...payload})
    });
  }catch(e){ console.error(e); setSyncNote('⚠️ Échec de la sauvegarde.', true); }
}
async function saveMembers(){ await postAction('saveMembers', {members}); }
async function saveEvents(){ await postAction('saveEvents', {events}); }
async function saveBirthdays(){ await postAction('saveBirthdays', {birthdays}); }

function renderLegend(){

  ).join('') + `<span><i style="background:repeating-linear-gradient(45deg,#E4E2D8,#E4E2D8 2px,#D6D4C6 2px,#D6D4C6 4px)"></i>Repos</span>`;
}

function segmentsForCell(memberId, dateStr){
  const segs = [];
  events.filter(ev=>ev.date===dateStr && ev.memberId===memberId).forEach(ev=>{
    const r = eventRange(ev);
    const startMin = toMinutes(r.start);
    let endMin = toMinutes(r.end);
    if(endMin<=startMin) endMin = 1440; // nuit : va jusqu'au bord droit, suite affichée le lendemain
    segs.push({startMin, endMin, ev});
  });
  const prevDateStr = addDays(dateStr,-1);
  events.filter(ev=>ev.date===prevDateStr && ev.memberId===memberId).forEach(ev=>{
    const r = eventRange(ev);
    const startMin = toMinutes(r.start), endMin = toMinutes(r.end);
    if(endMin<=startMin){
      segs.push({startMin:0, endMin, ev, spill:true});
    }
  });
  return segs;
}

function renderTimeBar(memberId, dateStr, memberColor){
  const segs = segmentsForCell(memberId, dateStr);
  if(!segs.length) return '<div class="time-bar"></div>';
  const inner = segs.map(s=>{
    const col = eventColor(s.ev, {color:memberColor});
    const left = (s.startMin/1440*100).toFixed(2);
    const width = Math.max((s.endMin-s.startMin)/1440*100, 1).toFixed(2);
    const cls = 'seg' + (s.ev.type==='repos' ? ' repos' : '');
    const bgStyle = col ? `background:${col.bg};` : '';
    const r = eventRange(s.ev);
    const title = `${eventLabel(s.ev)} (${r.start}–${r.end})`;
    return `<div class="${cls}" style="left:${left}%;width:${width}%;${bgStyle}" title="${title}"></div>`;
  }).join('');
  return `<div class="time-bar">${inner}</div>`;
}

function renderCalendar(){
  document.getElementById('monthLabel').textContent =
    MONTH_NAMES[currentMonth.getMonth()]+' '+currentMonth.getFullYear();

  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const ds = todayStr();

  const head = document.getElementById('monthTableHead');
  head.innerHTML = '<th class="col-day">Jour</th>' + members.map(m=>
    `<th class="member-th"><div class="th-inner"><span class="dot" style="background:${m.color}"></span>${m.name}</div></th>`
  ).join('');

  const body = document.getElementById('monthTableBody');
  body.innerHTML = '';

  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(year, month, day);
    const dateStr = fmt(d);
    const dow = (d.getDay()+6)%7;
    const isWeekend = dow>=5;
    const holiday = holidayOn(dateStr);
    const bdays = birthdaysOn(dateStr);

    const tr = document.createElement('tr');
    if(isWeekend) tr.classList.add('weekend');
    if(holiday) tr.classList.add('holiday');
    if(dateStr===ds) tr.classList.add('is-today');

    const dayTitle = holiday ? holiday.label : '';
    let rowHtml = `<td class="col-day" title="${dayTitle}">
      <div class="dnum">${day}${bdays.length ? ' 🎂' : ''}${holiday && !bdays.length ? ' 🏖' : ''}</div>
      <div class="dwd">${WEEKDAY_NAMES[dow]}</div>
    </td>`;

    members.forEach(m=>{
      rowHtml += `<td class="member-cell" data-date="${dateStr}" data-member="${m.id}">${renderTimeBar(m.id, dateStr, m.color)}</td>`;
    });

    tr.innerHTML = rowHtml;
    tr.querySelectorAll('td.member-cell').forEach(td=>{
      td.onclick = ()=> openDayPanel(td.dataset.date, td.dataset.member);
    });
    tr.querySelector('td.col-day').onclick = ()=> openDayPanel(dateStr);
    body.appendChild(tr);
  }
}

/* ---------- Day panel ---------- */
function openDayPanel(dateStr, presetMemberId){
  selectedDate = dateStr;
  const d = new Date(dateStr+'T00:00:00');
  document.getElementById('dayPanelDate').textContent =
    WEEKDAY_NAMES[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTH_NAMES[d.getMonth()]+' '+d.getFullYear();

  const summaryBox = document.getElementById('daySummary');
  summaryBox.innerHTML = '<div class="day-summary">' + members.map(m=>{
    const dayEvts = events.filter(ev=>ev.date===dateStr && ev.memberId===m.id);
    const chipsHtml = dayEvts.length ? dayEvts.map(ev=>{
      const col = eventColor(ev, m);
      const style = col ? `style="background:${col.bg};color:${col.fg}"` : '';
      const cls = 'evt-chip' + (ev.type==='repos' ? ' repos' : '');
      const r = eventRange(ev);
      return `<div class="${cls}" ${style}>${eventShortText(ev)} · ${r.start}–${r.end}</div>`;
    }).join('') : '<div class="day-summary-empty">Rien de prévu</div>';
    return `<div class="day-summary-row">
      <div class="day-summary-name"><span class="dot" style="background:${m.color}"></span> ${m.name}</div>
      <div class="day-summary-chips">${chipsHtml}</div>
    </div>`;
  }).join('') + '</div>';

  const listBox = document.getElementById('dayEvtList');
  const dayEvts = events.filter(ev=>ev.date===dateStr);
  if(!dayEvts.length){
    listBox.innerHTML = '<div class="empty-note">Rien de prévu ce jour-là.</div>';
  } else {
    listBox.innerHTML = dayEvts.map(ev=>{
      const m = members.find(x=>x.id===ev.memberId);
      const r = eventRange(ev);
      return `<div class="evt-item">
        <span class="evt-dot" style="background:${m?m.color:'#999'}"></span>
        <div class="evt-body">
          <div class="evt-title">${eventLabel(ev)}${ev.auto?' <span style="color:var(--muted);font-weight:400">(auto)</span>':''}</div>
          <div class="evt-sub">${m?m.name:'?'} · ${r.start}–${r.end}</div>
        </div>
        <button class="evt-del" data-id="${ev.id}">🗑</button>
      </div>`;
    }).join('');
    listBox.querySelectorAll('.evt-del').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.id;
        events = events.filter(e=> e.id!==id && e.linkedTo!==id);
        await saveEvents();
        openDayPanel(dateStr);
        renderCalendar();
        renderTodayAvail();
      };
    });
  }

  renderAddForm(document.getElementById('dayAddForm'), dateStr, presetMemberId);
  document.getElementById('dayOverlay').classList.add('open');
}

/* ---------- Add form (shared by day panel + FAB modal) ---------- */
function renderAddForm(el, presetDate, presetMemberId){
  addFormSelectedMembers = presetMemberId ? [presetMemberId] : (members[0] ? [members[0].id] : []);
  addFormType = 'rdv';
  addFormPresetId = null;
  addFormCustomShift = false;

  el.innerHTML = `
    <label>Qui</label>
    <div class="member-picker" id="mpk"></div>

    <label>Date</label>
    <input type="date" id="evDate" value="${presetDate || todayStr()}">

    <label>Type</label>
    <div class="type-picker" id="tpk"></div>

    <div id="dynamicSlotZone"></div>

    <label>Note (optionnel)</label>
    <input type="text" id="evLabel" placeholder="Ex : Pédiatre, astreinte...">

    <div class="hint" id="nightHint" style="display:none;">
      Une nuit EDF (créneau fixe) te rend automatiquement indisponible le lendemain matin jusqu'à ${REPOS_END_DEFAULT}.
    </div>

    <button type="submit" class="submitbtn">Ajouter</button>
  `;

  const mpk = el.querySelector('#mpk');
  const tpk = el.querySelector('#tpk');

  function allowedTypes(){
    const single = addFormSelectedMembers.length===1 ? members.find(m=>m.id===addFormSelectedMembers[0]) : null;
    const isAntoine = single && single.name.trim().toLowerCase() === SOLO_ONLY_MEMBER_NAME.toLowerCase();
    return isAntoine ? TYPES : TYPES.filter(t=>!SOLO_ONLY_TYPES.includes(t.id));
  }

  function renderTypePicker(){
    const list = allowedTypes();
    if(!list.find(t=>t.id===addFormType)){
      addFormType = 'rdv';
      addFormPresetId = null;
      addFormCustomShift = false;
    }
    tpk.innerHTML = '';
    list.forEach(t=>{
      const opt = document.createElement('div');
      opt.className = 'type-opt'+(t.id===addFormType?' selected':'');
      opt.textContent = t.icon+' '+t.label;
      opt.onclick = ()=>{
        addFormType = t.id;
        addFormPresetId = null;
        addFormCustomShift = false;
        tpk.querySelectorAll('.type-opt').forEach(o=>o.classList.remove('selected'));
        opt.classList.add('selected');
        renderDynamicZone();
      };
      tpk.appendChild(opt);
    });
  }

  const mpkOpt = (m)=>{
    const opt = document.createElement('div');
    opt.className = 'member-opt'+(addFormSelectedMembers.includes(m.id)?' selected':'');
    opt.style.color = m.color;
    opt.innerHTML = `<span class="dot" style="background:${m.color}"></span>${m.name}`;
    opt.onclick = ()=>{
      if(addFormSelectedMembers.includes(m.id)){
        addFormSelectedMembers = addFormSelectedMembers.filter(x=>x!==m.id);
      } else {
        addFormSelectedMembers.push(m.id);
      }
      opt.classList.toggle('selected');
      renderTypePicker();
      renderDynamicZone();
    };
    return opt;
  };
  members.forEach(m=> mpk.appendChild(mpkOpt(m)));
  renderTypePicker();

  function renderDynamicZone(){
    const zone = el.querySelector('#dynamicSlotZone');
    const hint = el.querySelector('#nightHint');
    hint.style.display = 'none';

    if(addFormType==='edf' || addFormType==='pompiers'){
      const presets = SHIFT_PRESETS.filter(p=>p.typeId===addFormType);
      if(!addFormCustomShift) addFormPresetId = addFormPresetId || presets[0].id;
      zone.innerHTML = `<label>Créneau</label><div class="preset-picker" id="ppk"></div><div id="customTimeZone"></div>`;
      const ppk = zone.querySelector('#ppk');

      presets.forEach(p=>{
        const opt = document.createElement('div');
        opt.className = 'preset-opt'+((!addFormCustomShift && p.id===addFormPresetId)?' selected':'');
        opt.style.background = p.color;
        opt.style.color = p.textColor;
        opt.innerHTML = `<span>${p.label}</span><span class="t">${p.start}–${p.end}</span>`;
        opt.onclick = ()=>{
          addFormPresetId = p.id;
          addFormCustomShift = false;
          ppk.querySelectorAll('.preset-opt').forEach(o=>o.classList.remove('selected'));
          opt.classList.add('selected');
          zone.querySelector('#customTimeZone').innerHTML = '';
          hint.style.display = AUTO_UNAVAILABLE_PRESET_IDS.includes(p.id) ? 'block' : 'none';
        };
        ppk.appendChild(opt);
      });

      const customOpt = document.createElement('div');
      customOpt.className = 'preset-opt'+(addFormCustomShift?' selected':'');
      customOpt.style.background = 'var(--surface)';
      customOpt.style.color = 'var(--ink)';
      customOpt.style.borderStyle = 'dashed';
      customOpt.innerHTML = `<span>Horaire personnalisé</span><span class="t">à définir</span>`;
      customOpt.onclick = ()=>{
        addFormCustomShift = true;
        addFormPresetId = null;
        ppk.querySelectorAll('.preset-opt').forEach(o=>o.classList.remove('selected'));
        customOpt.classList.add('selected');
        hint.style.display = 'none';
        showCustomTimeInputs();
      };
      ppk.appendChild(customOpt);

      function showCustomTimeInputs(){
        zone.querySelector('#customTimeZone').innerHTML = `
          <div class="time-row">
            <div><label>Début</label><input type="time" id="customStart" value="08:00"></div>
            <div><label>Fin</label><input type="time" id="customEnd" value="16:00"></div>
          </div>`;
      }
      if(addFormCustomShift) showCustomTimeInputs();

    } else if(addFormType==='rdv'){
      zone.innerHTML = `
        <div class="time-row">
          <div><label>Début</label><input type="time" id="rdvStart" value="09:00"></div>
          <div><label>Fin</label><input type="time" id="rdvEnd" value="10:00"></div>
        </div>`;
    }
  }
  renderDynamicZone();

  el.onsubmit = async (e)=>{
    e.preventDefault();
    if(!addFormSelectedMembers.length){ alert('Choisis au moins un membre.'); return; }
    const date = el.querySelector('#evDate').value;
    const label = el.querySelector('#evLabel').value.trim();

    const toAdd = [];
    for(const memberId of addFormSelectedMembers){
      let newEvt;
      if(addFormType==='edf' || addFormType==='pompiers'){
        if(addFormCustomShift){
          const s = el.querySelector('#customStart').value || '08:00';
          const en = el.querySelector('#customEnd').value || '16:00';
          newEvt = { id: uid(), date, memberId, type: addFormType, presetId:null, start:s, end:en, label, auto:false, linkedTo:null };
          toAdd.push(newEvt);
        } else {
          newEvt = { id: uid(), date, memberId, type: addFormType, presetId: addFormPresetId, label, auto:false, linkedTo:null };
          toAdd.push(newEvt);
          if(AUTO_UNAVAILABLE_PRESET_IDS.includes(addFormPresetId)){
            toAdd.push({
              id: uid(), date: addDays(date,1), memberId, type:'repos',
              start:'00:00', end: REPOS_END_DEFAULT,
              label: `Indisponible après nuit EDF, jusqu'à ${REPOS_END_DEFAULT}`, auto:true, linkedTo:newEvt.id
            });
          }
        }
      } else if(addFormType==='rdv'){
        const s = el.querySelector('#rdvStart').value || '09:00';
        const en = el.querySelector('#rdvEnd').value || '10:00';
        newEvt = { id: uid(), date, memberId, type:'rdv', start:s, end:en, label, auto:false, linkedTo:null };
        toAdd.push(newEvt);
      }
    }

    const conflicts = [];
    toAdd.forEach(evt=>{
      findOverlaps(evt, evt.memberId).forEach(o=>{
        const m = members.find(x=>x.id===evt.memberId);
        const r = eventRange(o);
        conflicts.push(`${m?m.name:'?'} : « ${eventLabel(evt)} » chevauche « ${eventLabel(o)} » (${r.start}–${r.end})`);
      });
    });
    if(conflicts.length){
      const ok = confirm('⚠️ Chevauchement détecté :\n\n' + conflicts.join('\n') + '\n\nAjouter quand même ?');
      if(!ok) return;
    }

    toAdd.forEach(evt=> events.push(evt));
    await saveEvents();
    document.getElementById('dayOverlay').classList.remove('open');
    document.getElementById('addOverlay').classList.remove('open');
    renderCalendar();
    renderTodayAvail();
  };
}

};

/* ---------- Wiring ---------- */
document.getElementById('btnPrev').onclick = ()=>{ currentMonth.setMonth(currentMonth.getMonth()-1); renderCalendar(); };
document.getElementById('btnNext').onclick = ()=>{ currentMonth.setMonth(currentMonth.getMonth()+1); renderCalendar(); };
document.getElementById('btnToday').onclick = ()=>{ currentMonth = new Date(); currentMonth.setDate(1); renderCalendar(); };
document.getElementById('closeDayPanel').onclick = ()=> document.getElementById('dayOverlay').classList.remove('open');
document.getElementById('dayOverlay').onclick = (e)=>{ if(e.target.id==='dayOverlay') e.currentTarget.classList.remove('open'); };

document.getElementById('fabAdd').onclick = ()=>{
  renderAddForm(document.getElementById('quickAddForm'), selectedDate || todayStr());
  document.getElementById('addOverlay').classList.add('open');
};
document.getElementById('closeAddPanel').onclick = ()=> document.getElementById('addOverlay').classList.remove('open');
document.getElementById('addOverlay').onclick = (e)=>{ if(e.target.id==='addOverlay') e.currentTarget.classList.remove('open'); };

document.getElementById('closeMemberPanel').onclick = ()=> document.getElementById('memberOverlay').classList.remove('open');
document.getElementById('memberOverlay').onclick = (e)=>{ if(e.target.id==='memberOverlay') e.currentTarget.classList.remove('open'); };
document.getElementById('saveMemberBtn').onclick = async ()=>{
  const name = document.getElementById('newMemberName').value.trim();
  const color = document.getElementById('newMemberColor').value;
  if(!name){ alert('Donne un prénom.'); return; }
  members.push({id:uid(), name, color});
  await saveMembers();
  document.getElementById('newMemberName').value='';
  document.getElementById('memberOverlay').classList.remove('open');
  render();
};

document.getElementById('closeBirthdayPanel').onclick = ()=> document.getElementById('birthdayOverlay').classList.remove('open');
document.getElementById('birthdayOverlay').onclick = (e)=>{ if(e.target.id==='birthdayOverlay') e.currentTarget.classList.remove('open'); };

/* ---------- Init ---------- */
(async function init(){
  await loadData();
  render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
