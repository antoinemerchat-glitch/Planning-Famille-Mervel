<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Famille — Planning</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2F6F5E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF0E9;
    --surface: #FFFFFF;
    --border: #DBD9CC;
    --ink: #20261F;
    --muted: #6C7166;
    --accent: #2F6F5E;
    --accent-ink: #FFFFFF;
    --warn: #C1502E;
    --repos-bg: repeating-linear-gradient(45deg, #E4E2D8, #E4E2D8 4px, #D6D4C6 4px, #D6D4C6 8px);
    --radius: 10px;
    --shadow: 0 2px 10px rgba(32,38,31,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding-bottom:90px;
    -webkit-tap-highlight-color:transparent;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  header.top{
    padding:20px 16px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  header.top h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.02em;
  }
  header.top h1 span{color:var(--accent);}
  .today-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:99px;
    padding:5px 10px;
  }

  /* Today card */
  .today-card{
    margin:0 16px 16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .today-card h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    margin:0 0 10px;
  }
  .avail-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 0;
    border-top:1px solid var(--border);
  }
  .avail-row:first-of-type{border-top:none;}
  .avail-member{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;}
  .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .avail-status{font-size:13px;color:var(--muted);}
  .avail-status.busy{color:var(--ink);font-weight:500;}

  /* Members legend */
  .members-bar{
    margin:0 16px 16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }
  .chip{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:99px;
    padding:5px 10px 5px 8px;
    font-size:13px;
    font-weight:500;
  }
  .chip button{
    border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 0 0 4px;
  }
  .add-member-btn{
    border:1px dashed var(--border);
    background:none;
    border-radius:99px;
    padding:5px 12px;
    font-size:13px;
    color:var(--muted);
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }

  /* Calendar */
  .cal-nav{
    margin:0 16px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .cal-nav .month-label{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:17px;
    text-transform:capitalize;
  }
  .cal-nav-btns{display:flex;gap:6px;}
  .navbtn{
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:8px;
    width:32px;height:32px;
    font-size:15px;
    cursor:pointer;
    color:var(--ink);
  }
  .navbtn.today{width:auto;padding:0 10px;font-size:12px;font-family:'IBM Plex Mono',monospace;}

  .month-table-wrap{
    margin:0 16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:auto;
    box-shadow:var(--shadow);
    max-height:72vh;
  }
  table.month-table{
    border-collapse:collapse;
    width:100%;
    table-layout:fixed;
  }
  table.month-table th, table.month-table td{
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
  }
  table.month-table th:last-child, table.month-table td:last-child{border-right:none;}

  th.col-day, td.col-day{
    position:sticky;
    left:0;
    background:var(--surface);
    z-index:2;
    width:56px;
    min-width:56px;
  }
  thead th{
    position:sticky;
    top:0;
    background:var(--surface);
    z-index:1;
    padding:8px 6px;
    font-size:12px;
    font-weight:600;
    text-align:left;
  }
  thead th.col-day{z-index:3;}
  th.member-th{white-space:nowrap;}
  th.member-th .th-inner{display:flex;align-items:center;gap:6px;}

  td.col-day{
    padding:6px 6px;
    font-family:'IBM Plex Mono',monospace;
    vertical-align:middle;
  }
  td.col-day .dnum{font-size:13px;font-weight:600;}
  td.col-day .dwd{font-size:10px;color:var(--muted);text-transform:uppercase;}
  tr.weekend td.col-day{background:#F1EFE6;}
  tr.is-today td.col-day{background:#E4EFE8;}
  tr.is-today td.col-day .dnum{color:var(--accent);}

  td.member-cell{
    padding:5px 6px;
    cursor:pointer;
    vertical-align:middle;
  }
  td.member-cell:hover{background:#F7F6F0;}
  .seg-mini{display:flex;gap:2px;height:16px;}
  .seg-mini div{
    flex:1;
    border-radius:3px;
    background:#EEECE1;
    border:1px solid var(--border);
  }
  .seg-mini div.busy{border:none;}
  .seg-mini div.repos{background-image:var(--repos-bg);border:none;}
  .cell-icons{font-size:10px;letter-spacing:1px;color:var(--muted);margin-top:3px;min-height:11px;}

  /* FAB */
  .fab{
    position:fixed;
    bottom:22px;right:22px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    font-size:26px;
    box-shadow:0 4px 14px rgba(47,111,94,0.4);
    cursor:pointer;
    z-index:40;
  }

  /* Overlay / sheet */
  .overlay{
    position:fixed;inset:0;
    background:rgba(32,38,31,0.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.open{display:flex;}
  @media(min-width:640px){
    .overlay{align-items:center;}
  }
  .sheet{
    background:var(--surface);
    width:100%;
    max-width:480px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:18px 18px 22px;
  }
  @media(min-width:640px){
    .sheet{border-radius:16px;}
  }
  .sheet h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px;
    margin:0 0 4px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .sheet .closebtn{border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer;}
  .sheet .subdate{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:14px;}

  /* Day panel availability mini strip */
  .seg-table{margin-bottom:16px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .seg-row{display:flex;align-items:center;border-top:1px solid var(--border);}
  .seg-row:first-child{border-top:none;}
  .seg-name{width:88px;flex-shrink:0;font-size:12px;font-weight:600;padding:6px 8px;}
  .seg-cells{display:flex;flex:1;gap:2px;padding:6px 6px 6px 0;}
  .seg-cell{flex:1;height:20px;border-radius:4px;background:#EEECE1;border:1px solid var(--border);position:relative;}
  .seg-cell.busy{border:none;}
  .seg-cell.repos{background-image:var(--repos-bg);border:none;}
  .seg-label{text-align:center;font-size:9px;color:var(--muted);margin-top:2px;}
  .seg-labels{display:flex;flex:1;gap:2px;margin-left:88px;padding-right:6px;}
  .seg-labels div{flex:1;text-align:center;}

  /* event list */
  .evt-item{
    display:flex;align-items:flex-start;gap:8px;
    padding:8px 0;
    border-top:1px solid var(--border);
  }
  .evt-item:first-of-type{border-top:none;}
  .evt-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .evt-body{flex:1;}
  .evt-title{font-size:14px;font-weight:600;}
  .evt-sub{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .evt-del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;}
  .empty-note{font-size:13px;color:var(--muted);padding:10px 0;}

  /* form */
  form.addform{margin-top:14px;border-top:1px solid var(--border);padding-top:14px;}
  form.addform label{
    display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);
    margin:10px 0 4px;font-weight:600;
  }
  form.addform label:first-child{margin-top:0;}
  .member-picker{display:flex;flex-wrap:wrap;gap:6px;}
  .member-opt{
    border:1.5px solid var(--border);
    border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;
    display:flex;align-items:center;gap:6px;font-weight:500;background:var(--surface);
  }
  .member-opt.selected{border-color:currentColor;background:color-mix(in srgb, currentColor 12%, white);}
  select, input[type=text], input[type=date]{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 10px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    background:var(--surface);
    color:var(--ink);
  }
  .type-picker{display:flex;flex-wrap:wrap;gap:6px;}
  .type-opt{
    border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;background:var(--surface);
  }
  .type-opt.selected{border-color:var(--accent);background:#EAF3EF;}
  .slot-picker{display:flex;flex-wrap:wrap;gap:6px;}
  .slot-opt{border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;background:var(--surface);}
  .slot-opt.selected{border-color:var(--accent);background:#EAF3EF;}
  .submitbtn{
    margin-top:16px;width:100%;
    background:var(--accent);color:var(--accent-ink);
    border:none;border-radius:8px;padding:12px;
    font-size:15px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4;}
  .color-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .color-row input[type=color]{width:44px;height:34px;border:1px solid var(--border);border-radius:6px;padding:2px;background:var(--surface);}

  .sync-note{
    margin:20px 16px 0;
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    line-height:1.5;
  }
</style>
</head>
<body>

<header class="top">
  <h1>Famille<span>.</span></h1>
  <div class="today-pill mono" id="todayPill"></div>
</header>

<section class="today-card">
  <h2>Aujourd'hui — qui est dispo</h2>
  <div id="todayAvail"></div>
</section>

<div class="members-bar" id="membersBar"></div>

<div class="cal-nav">
  <div class="month-label" id="monthLabel"></div>
  <div class="cal-nav-btns">
    <button class="navbtn today" id="btnToday">Aujourd'hui</button>
    <button class="navbtn" id="btnPrev">‹</button>
    <button class="navbtn" id="btnNext">›</button>
  </div>
</div>

<div class="month-table-wrap">
  <table class="month-table">
    <thead><tr id="monthTableHead"></tr></thead>
    <tbody id="monthTableBody"></tbody>
  </table>
</div>

<p class="sync-note" id="syncNote">Chargement…</p>

<button class="fab" id="fabAdd">+</button>

<!-- Day panel -->
<div class="overlay" id="dayOverlay">
  <div class="sheet">
    <h3>Détail du jour <button class="closebtn" id="closeDayPanel">✕</button></h3>
    <div class="subdate mono" id="dayPanelDate"></div>
    <div id="daySegTable"></div>
    <div id="dayEvtList"></div>
    <form class="addform" id="dayAddForm"></form>
  </div>
</div>

<!-- Quick add modal -->
<div class="overlay" id="addOverlay">
  <div class="sheet">
    <h3>Ajouter <button class="closebtn" id="closeAddPanel">✕</button></h3>
    <form class="addform" id="quickAddForm"></form>
  </div>
</div>

<!-- Add member modal -->
<div class="overlay" id="memberOverlay">
  <div class="sheet">
    <h3>Nouveau membre <button class="closebtn" id="closeMemberPanel">✕</button></h3>
    <label>Prénom</label>
    <input type="text" id="newMemberName" placeholder="Ex : Léa">
    <div class="color-row">
      <input type="color" id="newMemberColor" value="#3A5A8C">
      <span class="hint">Couleur utilisée sur tout le planning</span>
    </div>
    <button class="submitbtn" id="saveMemberBtn">Ajouter ce membre</button>
  </div>
</div>

<script>
/* ---------- Config ---------- */
const TYPES = [
  {id:'rdv', label:'RDV', icon:'📅'},
  {id:'pompiers', label:'Pompiers', icon:'🚒'},
  {id:'edf', label:'EDF', icon:'⚡'},
  {id:'garde', label:'Garde enfant', icon:'🧸'},
  {id:'repos', label:'Repos', icon:'💤'},
  {id:'autre', label:'Autre', icon:'▪️'},
];
const SEGMENTS = [
  {id:'nuit',      label:'Nuit',   h0:0,  h1:6},
  {id:'matin',     label:'Matin',  h0:6,  h1:12},
  {id:'apresmidi', label:'Aprèm',  h0:12, h1:18},
  {id:'soir',      label:'Soir',   h0:18, h1:24},
];
const SLOTS = [
  {id:'nuit',      label:'Nuit (garde)', segs:['soir']}, // + spillover nuit next day handled specially
  {id:'matin',     label:'Matin',        segs:['matin']},
  {id:'apresmidi', label:'Après-midi',   segs:['apresmidi']},
  {id:'soir',      label:'Soirée',       segs:['soir']},
  {id:'journee',   label:'Journée entière', segs:['nuit','matin','apresmidi','soir']},
];
const DEFAULT_COLORS = ['#2F6F5E','#3A5A8C','#C1502E','#B08900','#7A4E9E','#1E8FA6'];
const REPOS_END_LABEL = '13h';

const WEEKDAY_NAMES = ['lun','mar','mer','jeu','ven','sam','dim'];
const MONTH_NAMES = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* ---------- State ---------- */
let members = [];
let events = [];
let currentMonth = new Date();
currentMonth.setDate(1);
let selectedDate = null; // 'YYYY-MM-DD'
let addFormSelectedMembers = [];
let addFormType = 'rdv';
let addFormSlot = 'matin';

function todayStr(){
  const d = new Date();
  return fmt(d);
}
function fmt(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

/* ---------- Config API ---------- */
// Colle ici l'URL de ton déploiement Apps Script (voir README.md)
const API_URL = 'https://script.google.com/macros/s/AKfycbzYA1OlLyXYeCKYNc0F3NbwkoIASkMoE1WOmD3azleOEbMm1ji69MON_lY7bLQ-bhQ04w/exec';

function setSyncNote(text, isError){
  const el = document.getElementById('syncNote');
  if(!el) return;
  el.textContent = text;
  el.style.color = isError ? 'var(--warn)' : 'var(--muted)';
}

/* ---------- Storage (Google Sheets via Apps Script) ---------- */
async function loadData(){
  if(API_URL.includes('COLLE_ICI')){
    setSyncNote('⚠️ Aucune API configurée — voir README.md pour connecter le Google Sheet.', true);
    members = [
      {id:uid(), name:'Toi', color: DEFAULT_COLORS[0]},
      {id:uid(), name:'Copine', color: DEFAULT_COLORS[1]},
    ];
    events = [];
    return;
  }
  try{
    setSyncNote('Synchronisation…');
    const res = await fetch(API_URL + '?action=getData');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    members = (data.members && data.members.length) ? data.members : [];
    events = data.events || [];
    if(!members.length){
      members = [
        {id:uid(), name:'Toi', color: DEFAULT_COLORS[0]},
        {id:uid(), name:'Copine', color: DEFAULT_COLORS[1]},
      ];
      await saveMembers();
    }
    setSyncNote('Synchronisé avec le Google Sheet familial.');
  }catch(err){
    console.error(err);
    setSyncNote('⚠️ Connexion au Sheet impossible — données non sauvegardées pour le moment.', true);
    if(!members.length){
      members = [
        {id:uid(), name:'Toi', color: DEFAULT_COLORS[0]},
        {id:uid(), name:'Copine', color: DEFAULT_COLORS[1]},
      ];
    }
  }
}
async function saveMembers(){
  if(API_URL.includes('COLLE_ICI')) return;
  try{
    await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'saveMembers', members})
    });
  }catch(e){ console.error(e); setSyncNote('⚠️ Échec de la sauvegarde des membres.', true); }
}
async function saveEvents(){
  if(API_URL.includes('COLLE_ICI')) return;
  try{
    await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'saveEvents', events})
    });
  }catch(e){ console.error(e); setSyncNote('⚠️ Échec de la sauvegarde des événements.', true); }
}

/* ---------- Availability logic ---------- */
// returns array of {segId, status:'busy'|'repos'|'free', evt} for a given date + member
function segmentsForMemberDate(memberId, dateStr){
  const result = {};
  SEGMENTS.forEach(s=> result[s.id] = {status:'free', evt:null});

  // events dated today for this member
  events.filter(ev=>ev.date===dateStr && ev.memberId===memberId).forEach(ev=>{
    const slot = SLOTS.find(s=>s.id===ev.slot) || SLOTS[1];
    slot.segs.forEach(segId=>{
      result[segId] = {status: ev.type==='repos' ? 'repos':'busy', evt: ev};
    });
  });

  // spillover: if member had a 'nuit' slot event the day before, mark 'nuit' segment busy today too
  const prev = new Date(dateStr);
  prev.setDate(prev.getDate()-1);
  const prevStr = fmt(prev);
  const prevNightEvt = events.find(ev=>ev.date===prevStr && ev.memberId===memberId && ev.slot==='nuit');
  if(prevNightEvt && result['nuit'].status==='free'){
    result['nuit'] = {status:'busy', evt: prevNightEvt};
  }
  return result;
}

function currentSegmentId(){
  const h = new Date().getHours();
  return SEGMENTS.find(s=> h>=s.h0 && h<s.h1)?.id || 'matin';
}

/* ---------- Rendering ---------- */
function render(){
  renderTodayPill();
  renderTodayAvail();
  renderMembersBar();
  renderCalendar();
}

function renderTodayPill(){
  const d = new Date();
  document.getElementById('todayPill').textContent =
    WEEKDAY_NAMES[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTH_NAMES[d.getMonth()];
}

function renderTodayAvail(){
  const box = document.getElementById('todayAvail');
  box.innerHTML = '';
  const ds = todayStr();
  const curSeg = currentSegmentId();
  members.forEach(m=>{
    const segs = segmentsForMemberDate(m.id, ds);
    const cur = segs[curSeg];
    const row = document.createElement('div');
    row.className = 'avail-row';
    let statusText, statusClass = 'avail-status';
    if(cur.status==='free'){
      statusText = 'Disponible';
    } else if(cur.status==='repos'){
      statusText = 'Repos (post-garde) jusqu\'à '+REPOS_END_LABEL;
      statusClass += ' busy';
    } else {
      const t = TYPES.find(t=>t.id===cur.evt.type);
      statusText = (t?t.icon+' ':'') + (cur.evt.label || (t?t.label:'Occupé'));
      statusClass += ' busy';
    }
    row.innerHTML = `<div class="avail-member"><span class="dot" style="background:${m.color}"></span>${m.name}</div>
      <div class="${statusClass}">${statusText}</div>`;
    box.appendChild(row);
  });
}

function renderMembersBar(){
  const bar = document.getElementById('membersBar');
  bar.innerHTML = '';
  members.forEach(m=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<span class="dot" style="background:${m.color}"></span>${m.name}
      <button title="Supprimer" data-id="${m.id}">✕</button>`;
    chip.querySelector('button').onclick = async (e)=>{
      e.stopPropagation();
      if(confirm(`Supprimer ${m.name} ? Ses événements resteront enregistrés mais ne s'afficheront plus.`)){
        members = members.filter(x=>x.id!==m.id);
        await saveMembers();
        render();
      }
    };
    bar.appendChild(chip);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'add-member-btn';
  addBtn.textContent = '+ Membre';
  addBtn.onclick = ()=> document.getElementById('memberOverlay').classList.add('open');
  bar.appendChild(addBtn);
}

function renderCalendar(){
  document.getElementById('monthLabel').textContent =
    MONTH_NAMES[currentMonth.getMonth()]+' '+currentMonth.getFullYear();

  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const ds = todayStr();

  // header row: "Jour" + one column per member
  const head = document.getElementById('monthTableHead');
  head.innerHTML = '<th class="col-day">Jour</th>' + members.map(m=>
    `<th class="member-th"><div class="th-inner"><span class="dot" style="background:${m.color}"></span>${m.name}</div></th>`
  ).join('');

  const body = document.getElementById('monthTableBody');
  body.innerHTML = '';

  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(year, month, day);
    const dateStr = fmt(d);
    const dow = (d.getDay()+6)%7; // Monday=0
    const isWeekend = dow>=5;

    const tr = document.createElement('tr');
    if(isWeekend) tr.classList.add('weekend');
    if(dateStr===ds) tr.classList.add('is-today');

    let rowHtml = `<td class="col-day"><div class="dnum">${day}</div><div class="dwd">${WEEKDAY_NAMES[dow]}</div></td>`;

    members.forEach(m=>{
      const segs = segmentsForMemberDate(m.id, dateStr);
      const barHtml = SEGMENTS.map(s=>{
        const st = segs[s.id];
        let cls = st.status==='busy' ? 'busy' : (st.status==='repos' ? 'repos' : '');
        const style = st.status==='busy' ? `style="background:${m.color}"` : '';
        return `<div class="${cls}" ${style} title="${s.label}"></div>`;
      }).join('');

      const dayEvtsForMember = events.filter(ev=>ev.date===dateStr && ev.memberId===m.id);
      const icons = [...new Set(dayEvtsForMember.map(ev=>{
        if(ev.type==='repos') return '💤';
        const t = TYPES.find(x=>x.id===ev.type);
        return t? t.icon : '';
      }))].join('');

      rowHtml += `<td class="member-cell" data-date="${dateStr}" data-member="${m.id}">
        <div class="seg-mini">${barHtml}</div>
        <div class="cell-icons">${icons}</div>
      </td>`;
    });

    tr.innerHTML = rowHtml;
    tr.querySelectorAll('td.member-cell').forEach(td=>{
      td.onclick = ()=> openDayPanel(td.dataset.date, td.dataset.member);
    });
    tr.querySelector('td.col-day').onclick = ()=> openDayPanel(dateStr);
    body.appendChild(tr);
  }
}

/* ---------- Day panel ---------- */
function openDayPanel(dateStr, presetMemberId){
  selectedDate = dateStr;
  const d = new Date(dateStr+'T00:00:00');
  document.getElementById('dayPanelDate').textContent =
    WEEKDAY_NAMES[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTH_NAMES[d.getMonth()]+' '+d.getFullYear();

  // segment table
  const segBox = document.getElementById('daySegTable');
  let rows = '<div class="seg-table">';
  members.forEach(m=>{
    const segs = segmentsForMemberDate(m.id, dateStr);
    rows += '<div class="seg-row"><div class="seg-name">'+m.name+'</div><div class="seg-cells">';
    SEGMENTS.forEach(s=>{
      const st = segs[s.id];
      let cls = 'seg-cell';
      let style = '';
      if(st.status==='busy'){ cls+=' busy'; style=`background:${m.color}`; }
      else if(st.status==='repos'){ cls+=' repos'; }
      rows += `<div class="${cls}" style="${style}" title="${s.label}: ${st.status}"></div>`;
    });
    rows += '</div></div>';
  });
  rows += '</div><div class="seg-labels">'+SEGMENTS.map(s=>`<div>${s.label}</div>`).join('')+'</div>';
  segBox.innerHTML = rows;

  // event list
  const listBox = document.getElementById('dayEvtList');
  const dayEvts = events.filter(ev=>ev.date===dateStr).sort((a,b)=> (a.slot>b.slot?1:-1));
  if(!dayEvts.length){
    listBox.innerHTML = '<div class="empty-note">Rien de prévu ce jour-là.</div>';
  } else {
    listBox.innerHTML = dayEvts.map(ev=>{
      const m = members.find(x=>x.id===ev.memberId);
      const t = TYPES.find(x=>x.id===ev.type);
      const slot = SLOTS.find(x=>x.id===ev.slot);
      return `<div class="evt-item">
        <span class="evt-dot" style="background:${m?m.color:'#999'}"></span>
        <div class="evt-body">
          <div class="evt-title">${t?t.icon:''} ${ev.label || (t?t.label:'')}${ev.auto?' <span style=\"color:var(--muted);font-weight:400\">(auto)</span>':''}</div>
          <div class="evt-sub">${m?m.name:'?'} · ${slot?slot.label:ev.slot}</div>
        </div>
        <button class="evt-del" data-id="${ev.id}">🗑</button>
      </div>`;
    }).join('');
    listBox.querySelectorAll('.evt-del').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.id;
        const target = events.find(e=>e.id===id);
        events = events.filter(e=> e.id!==id && e.linkedTo!==id);
        await saveEvents();
        openDayPanel(dateStr);
        renderCalendar();
        renderTodayAvail();
      };
    });
  }

  renderAddForm(document.getElementById('dayAddForm'), dateStr, presetMemberId);
  document.getElementById('dayOverlay').classList.add('open');
}

/* ---------- Add form (shared by day panel + FAB modal) ---------- */
function renderAddForm(el, presetDate, presetMemberId){
  addFormSelectedMembers = presetMemberId ? [presetMemberId] : (members[0] ? [members[0].id] : []);
  addFormType = 'rdv';
  addFormSlot = 'matin';

  el.innerHTML = `
    <label>Qui</label>
    <div class="member-picker" id="mpk"></div>

    <label>Date</label>
    <input type="date" id="evDate" value="${presetDate || todayStr()}">

    <label>Type</label>
    <div class="type-picker" id="tpk"></div>

    <label>Créneau</label>
    <div class="slot-picker" id="spk"></div>

    <label>Note (optionnel)</label>
    <input type="text" id="evLabel" placeholder="Ex : Pédiatre, astreinte...">

    <div class="hint" id="nightHint" style="display:none;">
      Une garde de nuit bloque automatiquement le repos le lendemain matin jusqu'à ${REPOS_END_LABEL}.
    </div>

    <button type="submit" class="submitbtn">Ajouter</button>
  `;

  const mpk = el.querySelector('#mpk');
  members.forEach(m=>{
    const opt = document.createElement('div');
    opt.className = 'member-opt'+(addFormSelectedMembers.includes(m.id)?' selected':'');
    opt.style.color = m.color;
    opt.innerHTML = `<span class="dot" style="background:${m.color}"></span>${m.name}`;
    opt.onclick = ()=>{
      if(addFormSelectedMembers.includes(m.id)){
        addFormSelectedMembers = addFormSelectedMembers.filter(x=>x!==m.id);
      } else {
        addFormSelectedMembers.push(m.id);
      }
      opt.classList.toggle('selected');
    };
    mpk.appendChild(opt);
  });

  const tpk = el.querySelector('#tpk');
  TYPES.forEach(t=>{
    const opt = document.createElement('div');
    opt.className = 'type-opt'+(t.id===addFormType?' selected':'');
    opt.textContent = t.icon+' '+t.label;
    opt.onclick = ()=>{
      addFormType = t.id;
      tpk.querySelectorAll('.type-opt').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
    };
    tpk.appendChild(opt);
  });

  const spk = el.querySelector('#spk');
  SLOTS.forEach(s=>{
    const opt = document.createElement('div');
    opt.className = 'slot-opt'+(s.id===addFormSlot?' selected':'');
    opt.textContent = s.label;
    opt.onclick = ()=>{
      addFormSlot = s.id;
      spk.querySelectorAll('.slot-opt').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      el.querySelector('#nightHint').style.display = (s.id==='nuit') ? 'block' : 'none';
    };
    spk.appendChild(opt);
  });

  el.onsubmit = async (e)=>{
    e.preventDefault();
    if(!addFormSelectedMembers.length){ alert('Choisis au moins un membre.'); return; }
    const date = el.querySelector('#evDate').value;
    const label = el.querySelector('#evLabel').value.trim();

    for(const memberId of addFormSelectedMembers){
      const newEvt = {
        id: uid(), date, memberId, type: addFormType, slot: addFormSlot,
        label, auto:false, linkedTo:null
      };
      events.push(newEvt);

      if(addFormSlot==='nuit'){
        const next = new Date(date+'T00:00:00');
        next.setDate(next.getDate()+1);
        const nextStr = fmt(next);
        events.push({
          id: uid(), date: nextStr, memberId, type:'repos', slot:'matin',
          label: `Repos post-garde jusqu'à ${REPOS_END_LABEL}`, auto:true, linkedTo:newEvt.id
        });
      }
    }
    await saveEvents();
    document.getElementById('dayOverlay').classList.remove('open');
    document.getElementById('addOverlay').classList.remove('open');
    renderCalendar();
    renderTodayAvail();
  };
}

/* ---------- Wiring ---------- */
document.getElementById('btnPrev').onclick = ()=>{
  currentMonth.setMonth(currentMonth.getMonth()-1);
  renderCalendar();
};
document.getElementById('btnNext').onclick = ()=>{
  currentMonth.setMonth(currentMonth.getMonth()+1);
  renderCalendar();
};
document.getElementById('btnToday').onclick = ()=>{
  currentMonth = new Date(); currentMonth.setDate(1);
  renderCalendar();
};
document.getElementById('closeDayPanel').onclick = ()=> document.getElementById('dayOverlay').classList.remove('open');
document.getElementById('dayOverlay').onclick = (e)=>{ if(e.target.id==='dayOverlay') e.currentTarget.classList.remove('open'); };

document.getElementById('fabAdd').onclick = ()=>{
  renderAddForm(document.getElementById('quickAddForm'), selectedDate || todayStr());
  document.getElementById('addOverlay').classList.add('open');
};
document.getElementById('closeAddPanel').onclick = ()=> document.getElementById('addOverlay').classList.remove('open');
document.getElementById('addOverlay').onclick = (e)=>{ if(e.target.id==='addOverlay') e.currentTarget.classList.remove('open'); };

document.getElementById('closeMemberPanel').onclick = ()=> document.getElementById('memberOverlay').classList.remove('open');
document.getElementById('memberOverlay').onclick = (e)=>{ if(e.target.id==='memberOverlay') e.currentTarget.classList.remove('open'); };
document.getElementById('saveMemberBtn').onclick = async ()=>{
  const name = document.getElementById('newMemberName').value.trim();
  const color = document.getElementById('newMemberColor').value;
  if(!name){ alert('Donne un prénom.'); return; }
  members.push({id:uid(), name, color});
  await saveMembers();
  document.getElementById('newMemberName').value='';
  document.getElementById('memberOverlay').classList.remove('open');
  render();
};

/* ---------- Init ---------- */
(async function init(){
  await loadData();
  render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

</script>
